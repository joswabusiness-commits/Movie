.msg.me{background:var(--inv);color:var(--invt);align-self:flex-end;border-radius:16px 16px 3px 16px}
.msg .meta{font-size:12px;opacity:.75}.msg .meta b{margin-right:6px;font-weight:400;text-decoration:underline wavy}
.msg.sys{background:none;border:0;align-self:center;color:var(--mut);font-size:13px;padding:0}
.vrow{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);padding:6px 12px;border-radius:14px 4px 14px 4px;background:var(--bg)}
.vrow span{flex:1;word-break:break-word}.vrow small{color:var(--mut);font-size:13px}.vrow small.h{color:var(--ink);font-family:'Lilita One';font-size:14px}
#form{display:flex;gap:8px;padding:12px;border-top:3px dashed var(--ink)}#form input{flex:1}
.ov{position:fixed;inset:0;background:var(--dd),var(--bg);display:grid;place-items:center;z-index:90;padding:16px;overflow:auto}

.row{display:flex;gap:8px}.row input{flex:1}#rid{text-transform:uppercase;letter-spacing:4px}

.code{font:34px 'Lilita One';letter-spacing:8px;text-align:center}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){

.film{flex:none;transform:none}#stage{flex:none;aspect-ratio:16/9}aside{height:70dvh;border-left:0;border-top:4px solid var(--ink)}
.q{font-size:12px}.src{min-width:100%}}
</style>

$('name').value = localStorage.getItem('sr_name') || '';
async function enter(id, creating) {
  name = $('name').value.trim(); $('err').textContent = '';
  if (!name) { $('err').textContent = 'Please enter your name.'; return; }
  id = id.trim().toUpperCase();
  if (!/^[A-Z0-9]{4,12}$/.test(id)) { $('err').textContent = 'Enter a valid Room ID.'; return; }
  if (!creating) {
    try {
      const s = await Promise.race([db.ref('rooms/' + id + '/host').once('value'), new Promise((_, r) => setTimeout(r, 8000))]);
      if (!s.val()) { $('err').textContent = 'Room not found. Check the ID or ask the host for the link.'; return; }
    } catch (e) { $('err').textContent = 'Cannot reach the database. Check your Firebase config and rules.'; return; }
  }
  localStorage.setItem('sr_name', name);
  room = id; history.replaceState(null, '', '?room=' + room);
  const pass = $('hpass').value.trim();
  if (creating) await ref('pass').set(pass);
  $('modal').classList.add('hide'); $('code').textContent = room;
  start(creating);
}
$('create').onclick = () => enter(genId(), true);
$('join').onclick = () => enter($('rid').value, false);
$('rid').onkeydown = $('name').onkeydown = $('hpass').onkeydown = e => { if (e.key === 'Enter') ($('rid').value ? $('join') : $('create')).click(); };
$('code').onclick = () => copy(room, 'Room code copied!');

// ---------- Fullscreen (works on desktop, Android, iPad and iPhone) ----------
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function pfs(on) { document.body.classList.toggle('pfs', on); fsLabel(); }
function fsLabel() {
  const on = !!fsEl() || document.body.classList.contains('pfs');
  $('fs').textContent = on ? 'Exit fullscreen' : 'Fullscreen'; $('fsin').textContent = on ? 'Exit fullscreen' : 'Fullscreen';
}
function toggleFs() {
  if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (document.body.classList.contains('pfs')) { pfs(false); return; }
  const s = $('stage'), rq = s.requestFullscreen || s.webkitRequestFullscreen;
  if (!rq) return pfs(true);
  try { const r = rq.call(s); if (r && r.catch) r.catch(() => pfs(true)); } catch (e) { pfs(true); }
}
$('fs').onclick = $('fsin').onclick = toggleFs;
['fullscreenchange', 'webkitfullscreenchange'].forEach(e => document.addEventListener(e, fsLabel));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('pfs')) pfs(false); });

// ---------- Role Toggle (Host <-> Viewer) ----------
async function claimHost() {
  if (isHost) {
    if (stream) stopShare();
    await ref('host').remove();
    sys(name + ' stepped down to viewer');
    toast('Switched to viewer mode');
    return;
  }
  const passSnap = await ref('pass').once('value');
  const storedPass = passSnap.val() || '';
  if (storedPass !== '') {
    let inputPass = $('hpass').value.trim();
    if (!inputPass) {
      inputPass = prompt('Enter the host password for this room:');
      if (inputPass === null) return;
    }
    if (inputPass !== storedPass) { toast('Wrong host password'); return; }
  }
  await ref('screen').remove(); await ref('rtc').remove();
  await ref('host').set({id: me, name});
  sys(name + ' is now the host');
  toast('You are the host now!');
}
$('role').onclick = claimHost;
$('claim').onclick = claimHost;

// ---------- Invite / QR ----------
$('invite').onclick = () => {
  const l = link(); $('invlink').value = l; $('invcode').textContent = room;
  const q = $('qr'); q.innerHTML = '';
  if (window.QRCode) new QRCode(q, {text: l, width: 200, height: 200, colorDark: '#141414', colorLight: '#f2f2f2', correctLevel: QRCode.CorrectLevel.M});
  else q.textContent = 'QR unavailable. Use the link below.';
  $('nshare').classList.toggle('hide', !navigator.share); $('inv').classList.remove('hide');
};
$('invx').onclick = () => $('inv').classList.add('hide');
$('inv').onclick = e => { if (e.target === $('inv')) $('inv').classList.add('hide'); };
$('cplink').onclick = () => copy(link(), 'Invite link copied!');
$('cpcode').onclick = () => copy(room, 'Room code copied!');
$('nshare').onclick = () => navigator.share({title: 'Join my SyncRoom', text: 'Watch with me! Room ' + room, url: link()}).catch(() => {});
if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) $('shareScr').classList.add('hide'), $('qbox').querySelectorAll('label').forEach(l => l.classList.add('hide'));

// ---------- Tabs ----------
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('list').classList.toggle('hide', tab !== 'list'); $('viewers').classList.toggle('hide', tab !== 'viewers');
  $('form').classList.toggle('hide', tab !== 'list');
  if (tab === 'list') { unread = 0; $('unread').classList.add('hide'); $('list').scrollTop = $('list').scrollHeight; }
});

// ---------- Room start ----------
function setRole() {
  document.body.classList.toggle('viewer', !isHost);
  $('role').textContent = isHost ? 'HOST' : 'VIEWER';
  $('role').className = 'role ' + (isHost ? 'h' : 'v');
  $('role').title = isHost ? 'Click to switch to viewer' : 'Click to enter the password and become host';
}
function start(creating) {
  joinedAt = now();
  if (creating) ref('host').set({id: me, name});
  db.ref('.info/connected').on('value', s => {
    const on = s.val() === true;
    $('live').classList.toggle('off', !on); $('st').textContent = on ? 'Synced' : 'Reconnecting…';
    if (!on) return;
    const p = ref('presence/' + me);
    p.onDisconnect().remove().then(() => p.set({name, joined: TS}));
    ref('messages').push().onDisconnect().set({sender: 'System', system: true, text: name + ' left', timestamp: TS});
  });
  sys(name + (creating ? ' created the room' : ' joined'));

  ref('host').on('value', s => {
    const was = isHost; host = s.val(); isHost = !!host && host.id === me;
    if (was && !isHost) stopShare(true);
    setRole(); renderViewers();
  });
  ref('presence').on('value', s => {
    const v = s.val() || {};
    viewers = Object.entries(v).map(([id, x]) => ({id, name: x.name || '?', joined: x.joined || 0})).sort((a, b) => a.joined - b.joined);
    renderViewers(); if (isHost && stream) syncPcs();
  });
  ref('messages').limitToLast(80).on('child_added', s => {
    const m = s.val(); if (!m || !m.text) return;
    const d = document.createElement('div');
    d.className = 'msg' + (m.system ? ' sys' : m.uid === me ? ' me' : '');
    if (m.system) d.textContent = m.text;
    else {
      const meta = document.createElement('div'); meta.className = 'meta';
      const b = document.createElement('b'); b.textContent = m.sender;
      const t = document.createElement('span');
      t.textContent = new Date(m.timestamp || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
      meta.append(b, t);
      const tx = document.createElement('div'); tx.textContent = m.text;
      d.append(meta, tx);
    }
    const l = $('list'); l.appendChild(d);
    while (l.children.length > 150) l.firstChild.remove();
    l.scrollTop = l.scrollHeight;
    if (tab !== 'list' && !m.system) { $('unread').textContent = ++unread; $('unread').classList.remove('hide'); }
  });
  ref('reactions').limitToLast(1).on('child_added', s => {
    const r = s.val(); if (!r || !r.t || r.t < now() - 5000 || r.t < joinedAt - 1000) return;
    const e = document.createElement('span'); e.textContent = r.e; e.style.left = (8 + Math.random() * 80) + '%';
    $('fx').appendChild(e); setTimeout(() => e.remove(), 3100);
  });
  ref('videoSource').on('value', s => { const v = s.val(); if (v && v.url !== curUrl) loadSource(v); });
  ref('videoState').on('value', s => { latest = s.val(); apply(latest); });
  ref('screen').on('value', s => onScreen(s.val()));
  viewerRtc();
  ref('want').on('child_added', s => wantConn(s.key)); ref('want').on('child_changed', s => wantConn(s.key));
  loadYTApi();
  setInterval(pollYT, 500);
  setInterval(() => {
    if (isHost && player && !applying && !screenOn && player.playing())
      ref('videoState').set({currentTime: player.time(), isPlaying: true, timestamp: TS, by: me, hb: true});
  }, 4000);
}
function renderViewers() {
  const n = viewers.length;
  $('cnt').textContent = n + ' watching'; $('vc').textContent = n;
  const st = $('stack'); st.innerHTML = '';
  viewers.slice(0, 4).forEach(v => st.appendChild(av(v.name)));
  if (n > 4) { const m = av('+'); m.textContent = '+' + (n - 4); m.style.background = 'var(--soft)'; m.style.color = 'var(--ink)'; st.appendChild(m); }
  const box = $('viewers'); box.innerHTML = '';
  viewers.forEach(v => {
    const r = document.createElement('div'); r.className = 'vrow';
    const nm = document.createElement('span'); nm.textContent = v.name + (v.id === me ? ' (you)' : '');
    const h = host && host.id === v.id; const s = document.createElement('small');
    s.textContent = h ? 'Host' : 'Viewer'; if (h) s.className = 'h';
    r.append(av(v.name), nm, s); box.appendChild(r);
  });
  const hostHere = host && viewers.some(v => v.id === host.id), meHere = viewers.some(v => v.id === me);
  $('claim').classList.toggle('hide', !(host && !isHost && !hostHere && meHere));
}
$('react').onclick = e => {
  if (e.target.tagName !== 'BUTTON' || !room) return;
  const r = ref('reactions').push({e: e.target.textContent, by: me, t: TS});
  setTimeout(() => r.remove(), 5000);
};
$('form').onsubmit = e => {
  e.preventDefault();
  const t = $('msg').value.trim(); if (!t || !room) return;
  ref('messages').push({sender: name, uid: me, text: t, timestamp: TS});
  $('msg').value = '';
};

// ---------- Video source ----------
function parse(u) {
  const m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m ? {type: 'yt', id: m[1], url: u} : {type: 'mp4', url: u};
}
$('load').onclick = () => {
  const u = $('url').value.trim();
  if (!room || !isHost) return;
  if (!/^https?:\/\//i.test(u)) return toast('Enter a valid http(s) URL');
  const src = parse(u); src.by = me;
  ref('videoSource').set(src);
  ref('videoState').set({currentTime: 0, isPlaying: false, timestamp: TS, by: me});
  sys(name + ' loaded a new video'); $('url').value = '';
};
$('url').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('load').click(); } };
$('sync').onclick = () => {
  if (screenOn && !isHost) { ref('want/' + me).set(TS); return toast('Reconnecting to the screen…'); }
  if (latest && player) { apply(latest, true); toast('Resynced with the room'); } else toast('Nothing to sync yet');
};
function loadYTApi() {
  if (window.YT && YT.Player) { ytApi = true; return; }
  window.onYouTubeIframeAPIReady = () => { ytApi = true; if (pendingYT) { const s = pendingYT; pendingYT = null; loadSource(s); } };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
}
function push(playing, msg) {
  if (applying || !player || !isHost) return;
  ref('videoState').set({currentTime: player.time(), isPlaying: playing, timestamp: TS, by: me});
  if (msg) sys(name + ' ' + msg);
}
function loadSource(src) {
  curUrl = src.url; player = null;
  const box = $('player'); box.innerHTML = '';
  if (src.type === 'mp4') {
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.preload = 'auto'; v.src = src.url;
    box.appendChild(v);
    v.onplay = () => push(true, 'played the video');
    v.onpause = () => push(false, 'paused the video');
    v.onseeked = () => push(!v.paused, 'jumped to ' + fmt(v.currentTime));
    v.onloadedmetadata = () => { player = {play: () => v.play().catch(() => toast('Click the video to start playback')), pause: () => v.pause(), seek: t => v.currentTime = t, time: () => v.currentTime, playing: () => !v.paused, yt: false}; apply(latest, true); };
    v.onerror = () => toast('Could not load this video URL');
  } else {
    if (!ytApi) { pendingYT = src; box.innerHTML = '<div class="ph">Loading YouTube player…</div>'; return; }
    const d = document.createElement('div'); d.id = 'ytp'; box.appendChild(d);
    const p = new YT.Player('ytp', {
      videoId: src.id, playerVars: {rel: 0, playsinline: 1, modestbranding: 1, fs: 1},
      events: {
        onReady: () => { player = {play: () => p.playVideo(), pause: () => p.pauseVideo(), seek: t => p.seekTo(t, true), time: () => p.getCurrentTime() || 0, playing: () => p.getPlayerState() === 1, yt: true}; apply(latest, true); },
        onStateChange: e => {
          if (!player) return;
          if (e.data === 1) push(true, 'played the video');
          else if (e.data === 2) push(false, 'paused the video');
          lastT = player.time();
        }
      }
    });
  }
}
function pollYT() {
  if (!player || !player.yt || !isHost) return;
  const t = player.time();
  if (applying) { lastT = t; return; }
  const expected = player.playing() ? 0.5 : 0;
  if (Math.abs(t - lastT - expected) > 1.2) push(player.playing(), 'jumped to ' + fmt(t));
  lastT = t;
}
function apply(s, force) {
  if (!player || !s || screenOn || (s.by === me && !force)) return;
  const t = s.currentTime + (s.isPlaying ? Math.max(0, (now() - s.timestamp) / 1000) : 0);
  const seek = Math.abs(player.time() - t) > (s.hb && !force ? 1.5 : 0.8);
  if (!seek && player.playing() === !!s.isPlaying) return;
  quiet(() => { if (seek) player.seek(t); s.isPlaying ? player.play() : player.pause(); });
}

// ---------- Screen share quality ----------
const RES = {720: [1280, 720], 1080: [1920, 1080], 1440: [2560, 1440], 2160: [3840, 2160]};
const BR = {720: 5e6, 1080: 10e6, 1440: 18e6, 2160: 32e6};
const FPSX = {30: 1, 60: 1.5, 90: 1.8, 120: 2};
['res', 'fps', 'hint2'].forEach(k => { const v = localStorage.getItem('sr_' + k); if (v && $(k).querySelector('[value="' + v + '"]')) $(k).value = v; });
const Q = () => ({h: +$('res').value, fps: +$('fps').value, hint: $('hint2').value});
const label = () => { const q = Q(); return (q.h === 2160 ? '4K' : q.h + 'p') + ' @ ' + q.fps + ' FPS'; };
function smsg(title, sub, live) {
  const m = $('smsg'); m.innerHTML = '';
  const w = document.createElement('div'); w.className = 'sm';
  if (live) { const r = document.createElement('span'); r.className = 'rec'; r.textContent = 'LIVE'; w.appendChild(r); }
  const b = document.createElement('b'); b.textContent = title; w.appendChild(b);
  if (sub) { const s = document.createElement('small'); s.textContent = sub; w.appendChild(s); }
  m.appendChild(w);
}
function tune(pc) {
  const q = Q();
  pc.getSenders().forEach(s => {
    if (!s.track || s.track.kind !== 'video') return;
    try {
      const p = s.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = Math.min(50e6, BR[q.h] * FPSX[q.fps]);
      p.encodings[0].maxFramerate = q.fps;
      p.encodings[0].scaleResolutionDownBy = 1;
      p.degradationPreference = q.hint === 'detail' ? 'maintain-resolution' : 'maintain-framerate';
      s.setParameters(p).catch(() => {});
    } catch (e) {}
  });
}
function liveApply() {
  ['res', 'fps', 'hint2'].forEach(k => localStorage.setItem('sr_' + k, $(k).value));
  if (!stream) return;
  const q = Q(), vt = stream.getVideoTracks()[0]; if (!vt) return;
  vt.contentHint = q.hint;
  vt.applyConstraints({width: {ideal: RES[q.h][0]}, height: {ideal: RES[q.h][1]}, frameRate: {ideal: q.fps}}).catch(() => {});
  Object.values(pcs).forEach(x => tune(x.pc));
  toast('Share quality: ' + label());
  if (!$('sv').srcObject) smsg('You are sharing your screen', label() + ' · viewers can see it live', true);
}
['res', 'fps', 'hint2'].forEach(k => $(k).onchange = liveApply);

// ---------- Screen share (WebRTC) ----------
function onScreen(v) {
  screenOn = !!v; const mine = !!v && v.by === me;
  $('scr').classList.toggle('hide', !v); $('player').classList.toggle('hide', !!v);
  $('sv').classList.toggle('hide', mine);
  const m = $('smsg');
  if (v) {
    m.classList.remove('hide');
    if (mine) smsg('You are sharing your screen', label() + ' · viewers can see it live', true);
    else smsg('Connecting to ' + (v.name || 'the host') + '\'s screen…', 'Hang tight, this only takes a moment');
    if (!mine) quiet(() => player && player.pause());
  } else {
    $('sv').srcObject = null; if (vpc) { vpc.close(); vpc = null; }
    if (latest) apply(latest, true);
  }
}
$('shareScr').onclick = () => stream ? stopShare() : startShare();
async function startShare() {
  if (!isHost) return;
  const q = Q();
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: {width: {ideal: RES[q.h][0]}, height: {ideal: RES[q.h][1]}, frameRate: {ideal: q.fps}},
      audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}
    });
  } catch (e) { stream = null; return toast('Screen share cancelled'); }
  const vt = stream.getVideoTracks()[0]; vt.contentHint = q.hint; vt.onended = () => stopShare();
  await ref('rtc').remove();
  ref('screen').onDisconnect().remove(); ref('rtc').onDisconnect().remove();
  await ref('screen').set({by: me, name, t: TS});
  quiet(() => player && player.pause());
  sys(name + ' started sharing their screen (' + label() + ')');
  $('shareScr').textContent = 'Stop sharing'; $('shareScr').classList.add('red');
  const st = vt.getSettings();
  if (st.height && st.height < RES[q.h][1] * 0.9) toast('Browser gave ' + st.width + 'x' + st.height + ' (your screen is smaller)');
  syncPcs();
}
function stopShare(silent) {
  const was = !!stream;
  if (stream) { stream.getTracks().forEach(t => { t.onended = null; t.stop(); }); stream = null; }
  Object.keys(pcs).forEach(id => dropPc(id));
  $('shareScr').textContent = 'Share screen'; $('shareScr').classList.remove('red');
  if (was && !silent) { ref('screen').remove(); ref('rtc').remove(); ref('want').remove(); sys(name + ' stopped sharing'); }
}
function syncPcs() {
  const ids = viewers.filter(v => v.id !== me).map(v => v.id);
  ids.forEach(id => { if (!pcs[id]) connectViewer(id); });
  Object.keys(pcs).forEach(id => { if (!ids.includes(id)) dropPc(id, true); });
}
function wantConn(id) { if (isHost && stream && id !== me && viewers.some(v => v.id === id)) connectViewer(id); }
function dropPc(id, rm) {
  const x = pcs[id];
  if (x) { x.offs.forEach(r => r.off()); try { x.pc.close(); } catch (e) {} delete pcs[id]; }
  if (rm) ref('rtc/' + id).remove();
}
async function connectViewer(id) {
  if (!stream) return;
  dropPc(id);
  const pc = new RTCPeerConnection(ICE), offs = []; pcs[id] = {pc, offs};
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  let ready = false, q = [];
  const sendC = c => ref('rtc/' + id + '/h').push(c);
  pc.onicecandidate = e => { if (!e.candidate) return; const c = e.candidate.toJSON(); ready ? sendC(c) : q.push(c); };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') setTimeout(() => { if (stream && pcs[id] && pcs[id].pc === pc) connectViewer(id); }, 1500);
  };
  try {
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    tune(pc);
    await ref('rtc/' + id).set({offer: {type: offer.type, sdp: offer.sdp}});
    ready = true; q.forEach(sendC); q = [];
    const ar = ref('rtc/' + id + '/answer'); offs.push(ar);
    ar.on('value', async s => {
      const a = s.val(); if (!a || pc.signalingState !== 'have-local-offer') return;
      try { await pc.setRemoteDescription(a); } catch (e) { return; }
      tune(pc);
      const vr = ref('rtc/' + id + '/v'); offs.push(vr);
      vr.on('child_added', c => pc.addIceCandidate(c.val()).catch(() => {}));
    });
  } catch (e) {}
}
function viewerRtc() {
  ref('rtc/' + me + '/offer').on('value', async s => {
    const o = s.val(); if (!o || isHost) return;
    if (vpc) { try { vpc.close(); } catch (e) {} vpc = null; }
    ref('rtc/' + me + '/h').off();
    const pc = vpc = new RTCPeerConnection(ICE);
    pc.ontrack = e => {
      const v = $('sv'); v.srcObject = e.streams[0]; v.muted = false;
      v.play().catch(() => { v.muted = true; v.play().catch(() => {}); toast('Tap the screen to unmute'); });
      $('smsg').classList.add('hide');
    };
    pc.onicecandidate = e => { if (e.candidate) ref('rtc/' + me + '/v').push(e.candidate.toJSON()); };
    pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed' && vpc === pc) ref('want/' + me).set(TS); };
    try {
      await pc.setRemoteDescription(o);
      const a = await pc.createAnswer(); await pc.setLocalDescription(a);
      await ref('rtc/' + me + '/answer').set({type: a.type, sdp: a.sdp});
      ref('rtc/' + me + '/h').on('child_added', c => pc.addIceCandidate(c.val()).catch(() => {}));
    } catch (e) {}
  });
}
$('sv').onclick = () => { $('sv').muted = false; $('sv').play().catch(() => {}); };
</script>
