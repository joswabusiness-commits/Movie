<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SyncRoom - Watch Together</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#2b3a52;--accent:#6366f1;--text:#e2e8f0;--muted:#94a3b8;--ok:#22c55e;--bad:#ef4444;--r:12px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;height:100dvh;overflow:hidden}
.hide{display:none!important}
input{background:var(--bg);border:1px solid var(--panel2);color:var(--text);padding:10px 12px;border-radius:8px;font:inherit;outline:none;min-width:0}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6366f144}
.btn{background:var(--accent);color:#fff;border:0;padding:10px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn.alt{background:var(--panel2)}.btn.sm{padding:7px 12px;font-size:13px}
#app{display:grid;grid-template-columns:1fr 360px;height:100%}
main{display:flex;flex-direction:column;padding:16px;gap:14px;min-width:0}
#stage{flex:1;background:#000;border-radius:var(--r);overflow:hidden;position:relative;box-shadow:0 10px 40px #0008;min-height:0}
#player,#player iframe,#player video{width:100%;height:100%;border:0;display:block;background:#000}
.ph{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);padding:10px 14px;border-radius:999px;box-shadow:0 8px 30px #0006;border:1px solid var(--panel2)}
.badge{background:var(--bg);border:1px dashed var(--accent);color:#c7d2fe;padding:6px 12px;border-radius:999px;font:700 14px ui-monospace,monospace;letter-spacing:2px;cursor:pointer}
.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.status.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.src{display:flex;gap:8px;flex:1;min-width:200px}.src input{flex:1;padding:7px 12px;border-radius:999px}
aside{background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--panel2);min-height:0}
aside header{padding:16px;border-bottom:1px solid var(--panel2);display:flex;justify-content:space-between;align-items:center}
aside header span{color:var(--muted);font-size:13px}
#list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{background:var(--panel2);padding:8px 12px;border-radius:12px 12px 12px 4px;max-width:90%;align-self:flex-start;word-break:break-word;animation:in .2s}
.msg.me{background:var(--accent);align-self:flex-end;border-radius:12px 12px 4px 12px}
.msg .meta{font-size:11px;opacity:.75;margin-bottom:2px}.msg .meta b{margin-right:6px}
.msg.sys{background:none;align-self:center;color:var(--muted);font-size:12px;font-style:italic;padding:2px}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
#form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--panel2)}#form input{flex:1}
#modal{position:fixed;inset:0;background:#0f172af2;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:9;padding:16px}
.card{background:var(--panel);padding:30px;border-radius:16px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--panel2);box-shadow:0 20px 60px #000a}
.card h1{font-size:26px}.card p{color:var(--muted);font-size:14px}
.or{text-align:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;gap:8px}.row input{flex:1;text-transform:uppercase}
#err{color:var(--bad);min-height:18px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);padding:8px 16px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:10}
#toast.show{opacity:1}
@media(max-width:820px){
#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
main{padding:10px}#stage{flex:none;aspect-ratio:16/9}
.bar{border-radius:var(--r)}aside{border-left:0;border-top:1px solid var(--panel2)}}
</style>
</head>
<body>
<div id="modal"><div class="card">
<h1>🎬 SyncRoom</h1><p>Watch videos in perfect sync with friends, with live chat.</p>
<input id="name" placeholder="Your display name" maxlength="20">
<button class="btn" id="create">Create New Room</button>
<div class="or">or join existing</div>
<div class="row"><input id="rid" placeholder="ROOM ID" maxlength="6"><button class="btn alt" id="join">Join</button></div>
<div id="err"></div></div></div>

<div id="app">
<main>
<div id="stage"><div id="player"><div class="ph">Paste a YouTube or MP4 link below and press Load to start watching together.</div></div></div>
<div class="bar">
<span class="badge" id="code" title="Click to copy room code"></span>
<button class="btn sm" id="share">🔗 Share Link</button>
<span class="status" id="status"><i></i><b>Connecting…</b></span>
<div class="src"><input id="url" placeholder="YouTube or direct .mp4 URL"><button class="btn sm" id="load">Load</button></div>
</div>
</main>
<aside>
<header><b>💬 Live Chat</b><span id="who"></span></header>
<div id="list"></div>
<form id="form"><input id="msg" placeholder="Send a message…" autocomplete="off" maxlength="300"><button class="btn">Send</button></form>
</aside>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ====== 1. PASTE YOUR FIREBASE CONFIG HERE ======
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
// ================================================
firebase.initializeApp(firebaseConfig);
const db = firebase.database(), TS = firebase.database.ServerValue.TIMESTAMP;
const $ = id => document.getElementById(id);
const me = Math.random().toString(36).slice(2, 10);
let room, name, offset = 0, player = null, curUrl = null, latest = null, applying = false, lastT = 0, pendingYT = null, ytApi = false;
const now = () => Date.now() + offset;
const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 1800); };
const genId = () => Array.from({length: 6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
const ref = p => db.ref('rooms/' + room + '/' + p);
const sys = t => ref('messages').push({sender: 'System', system: true, text: t, timestamp: TS});

db.ref('.info/serverTimeOffset').on('value', s => offset = s.val() || 0);
db.ref('.info/connected').on('value', s => {
  const on = s.val() === true;
  $('status').classList.toggle('on', on);
  $('status').querySelector('b').textContent = on ? 'Synced' : 'Reconnecting…';
});

// ---------- Entry modal ----------
const params = new URLSearchParams(location.search);
if (params.get('room')) $('rid').value = params.get('room').toUpperCase();
$('name').value = localStorage.getItem('sr_name') || '';
function enter(id) {
  name = $('name').value.trim();
  if (!name) { $('err').textContent = 'Please enter your name.'; return; }
  id = id.trim().toUpperCase();
  if (!/^[A-Z0-9]{4,12}$/.test(id)) { $('err').textContent = 'Enter a valid Room ID.'; return; }
  localStorage.setItem('sr_name', name);
  room = id;
  history.replaceState(null, '', '?room=' + room);
  $('modal').classList.add('hide');
  $('code').textContent = room;
  $('who').textContent = 'You: ' + name;
  start();
}
$('create').onclick = () => enter(genId());
$('join').onclick = () => enter($('rid').value);
$('rid').onkeydown = $('name').onkeydown = e => { if (e.key === 'Enter') ($('rid').value ? $('join') : $('create')).click(); };
const link = () => location.origin + location.pathname + '?room=' + room;
const copy = (t, m) => (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast(m), () => prompt('Copy this:', t));
$('share').onclick = () => copy(link(), 'Share link copied!');
$('code').onclick = () => copy(room, 'Room code copied!');

// ---------- Room start ----------
function start() {
  sys(name + ' joined');
  const lr = ref('messages').push();
  lr.onDisconnect().set({sender: 'System', system: true, text: name + ' left', timestamp: TS});

  ref('messages').limitToLast(100).on('child_added', s => {
    const m = s.val(); if (!m || !m.text) return;
    const d = document.createElement('div');
    d.className = 'msg' + (m.system ? ' sys' : m.sender === name ? ' me' : '');
    if (m.system) d.textContent = m.text;
    else {
      const meta = document.createElement('div'); meta.className = 'meta';
      const b = document.createElement('b'); b.textContent = m.sender;
      const t = document.createElement('span');
      t.textContent = new Date(m.timestamp || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
      meta.append(b, t);
      const tx = document.createElement('div'); tx.textContent = m.text;
      d.append(meta, tx);
    }
    $('list').appendChild(d);
    $('list').scrollTo({top: $('list').scrollHeight, behavior: 'smooth'});
  });

  ref('videoSource').on('value', s => { const v = s.val(); if (v && v.url !== curUrl) loadSource(v); });
  ref('videoState').on('value', s => { latest = s.val(); apply(latest); });
  loadYTApi();
  setInterval(pollYT, 500);
}
$('form').onsubmit = e => {
  e.preventDefault();
  const t = $('msg').value.trim(); if (!t || !room) return;
  ref('messages').push({sender: name, text: t, timestamp: TS});
  $('msg').value = '';
};

// ---------- Video source ----------
function parse(u) {
  const m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m ? {type: 'yt', id: m[1], url: u} : {type: 'mp4', url: u};
}
$('load').onclick = () => {
  const u = $('url').value.trim();
  if (!room) return;
  if (!/^https?:\/\//i.test(u)) return toast('Enter a valid http(s) URL');
  const src = parse(u); src.by = me;
  ref('videoSource').set(src);
  ref('videoState').set({currentTime: 0, isPlaying: false, timestamp: TS, by: me});
  sys(name + ' loaded a new video');
  $('url').value = '';
};
function loadYTApi() {
  if (window.YT && YT.Player) { ytApi = true; return; }
  window.onYouTubeIframeAPIReady = () => { ytApi = true; if (pendingYT) { const s = pendingYT; pendingYT = null; loadSource(s); } };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
}
function push(playing, msg) {
  if (applying || !player) return;
  ref('videoState').set({currentTime: player.time(), isPlaying: playing, timestamp: TS, by: me});
  if (msg) sys(name + ' ' + msg);
}
function loadSource(src) {
  curUrl = src.url; player = null;
  const box = $('player'); box.innerHTML = '';
  if (src.type === 'mp4') {
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.src = src.url;
    box.appendChild(v);
    v.onplay = () => push(true, 'played the video');
    v.onpause = () => push(false, 'paused the video');
    v.onseeked = () => push(!v.paused, 'jumped to ' + fmt(v.currentTime));
    v.onloadedmetadata = () => { player = {play: () => v.play().catch(() => toast('Click the video to start playback')), pause: () => v.pause(), seek: t => v.currentTime = t, time: () => v.currentTime, playing: () => !v.paused, yt: false}; apply(latest); };
    v.onerror = () => toast('Could not load this video URL');
  } else {
    if (!ytApi) { pendingYT = src; box.innerHTML = '<div class="ph">Loading YouTube player…</div>'; return; }
    const d = document.createElement('div'); d.id = 'ytp'; box.appendChild(d);
    const p = new YT.Player('ytp', {
      videoId: src.id, playerVars: {rel: 0, playsinline: 1, modestbranding: 1},
      events: {
        onReady: () => { player = {play: () => p.playVideo(), pause: () => p.pauseVideo(), seek: t => p.seekTo(t, true), time: () => p.getCurrentTime() || 0, playing: () => p.getPlayerState() === 1, yt: true}; apply(latest); },
        onStateChange: e => {
          if (!player) return;
          if (e.data === 1) push(true, 'played the video');
          else if (e.data === 2) push(false, 'paused the video');
          lastT = player.time();
        }
      }
    });
  }
}
// YouTube has no seek event, so detect jumps in playback time
function pollYT() {
  if (!player || !player.yt) return;
  const t = player.time();
  if (applying) { lastT = t; return; }
  const expected = player.playing() ? 0.5 : 0;
  if (Math.abs(t - lastT - expected) > 1.2) push(player.playing(), 'jumped to ' + fmt(t));
  lastT = t;
}
// ---------- Apply remote state ----------
function apply(s) {
  if (!player || !s || s.by === me) return;
  applying = true;
  const t = s.currentTime + (s.isPlaying ? Math.max(0, (now() - s.timestamp) / 1000) : 0);
  if (Math.abs(player.time() - t) > 0.8) player.seek(t);
  s.isPlaying ? player.play() : player.pause();
  setTimeout(() => { applying = false; lastT = player ? player.time() : 0; }, 1000);
}
</script>
</body>
</html>
