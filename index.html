<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SyncRoom - Watch Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Nunito:wght@600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#d6dae0;--card:#e5e8ec;--ink:#222a33;--mut:#5d6874;--soft:#c5cbd3;--inv:#2a323c;--invt:#e9ecf0;--frame:#bcc3cc;--sh:#222a33;--lg1:#2a323c;--lg2:#5d6874;--dd:none}
[data-theme=dark]{--bg:#0f1620;--card:#18222f;--ink:#d8e2ec;--mut:#8697a9;--soft:#243142;--inv:#d8e2ec;--invt:#0f1620;--frame:#8d9db0;--sh:#05090e;--lg1:#d8e2ec;--lg2:#7fa8d4}
[data-theme=cinema]{--bg:#2a050a;--card:#3b0b12;--ink:#f0d9b8;--mut:#c9a083;--soft:#5a111b;--inv:#c1121f;--invt:#fff0da;--frame:#e0b252;--sh:#120204;--lg1:#f6d58a;--lg2:#d99a2b;--dd:radial-gradient(ellipse at 50% 35%,rgba(0,0,0,0) 0,rgba(0,0,0,.6) 95%),repeating-linear-gradient(90deg,#560812 0 34px,#82101e 34px 58px,#560812 58px 96px)}
*{box-sizing:border-box;margin:0}
body{background:var(--dd),var(--bg);color:var(--ink);font:600 15px/1.45 Nunito,system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden;transition:background-color .3s,color .3s}
.hide{display:none!important}
input,select{background:var(--card);border:3px solid var(--ink);color:var(--ink);padding:8px 14px;border-radius:12px 18px 12px 18px;font:inherit;outline:none;min-width:0}
input:focus,select:focus{box-shadow:4px 4px 0 var(--sh)}
select{cursor:pointer;padding:6px 10px}select option{background:var(--card);color:var(--ink)}
.btn{background:var(--inv);color:var(--invt);border:3px solid var(--ink);padding:7px 16px;border-radius:255px 14px 225px 14px/14px 225px 14px 255px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:4px 4px 0 var(--sh);transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:6px 6px 0 var(--sh)}.btn:active{transform:translate(3px,3px);box-shadow:0 0 0}
.btn.alt{background:var(--card);color:var(--ink)}.btn.sm{padding:4px 12px;font-size:14px}
.btn.red{background:#c0392b;color:#fff;border-color:#7d1d14}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.themesel{font-weight:800;font-size:14px;padding:4px 10px;border-radius:999px}
#app{display:grid;grid-template-columns:1fr 350px;grid-template-rows:auto 1fr;height:100%}
.top{position:relative;grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--card);border-bottom:4px solid var(--ink);flex-wrap:wrap;box-shadow:0 5px 0 var(--soft)}
[data-theme=cinema] .top{background:linear-gradient(#4a0b13,#2e060b);border-bottom-color:#e0b252;box-shadow:0 6px 0 #7d101d}
.logo{font:24px Bungee,'Lilita One',cursive;letter-spacing:1px;background:linear-gradient(135deg,var(--lg1),var(--lg2));-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px;user-select:none}
.logo em{font-style:normal}
.badge{border:3px dashed var(--ink);padding:2px 12px;border-radius:12px;font:20px 'Lilita One';letter-spacing:4px;cursor:pointer;background:var(--card)}
.badge:hover{background:var(--inv);color:var(--invt)}
.role{font:15px 'Lilita One';padding:3px 12px;border:3px solid var(--ink);border-radius:999px;cursor:pointer;user-select:none}
.role.h{background:var(--inv);color:var(--invt)}.role.v{background:var(--card)}
.sp{flex:1}
.live{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);padding:3px 14px 3px 5px;border-radius:999px;background:var(--card)}
.stack{display:flex}.stack .av{margin-left:-10px}.stack .av:first-child{margin-left:0}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:15px 'Lilita One';flex:none;border:3px solid var(--ink)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--ink);animation:pulse 1.6s infinite}
.off .dot{animation:none;background:none;border:2px solid var(--ink)}
@keyframes pulse{50%{transform:scale(.55)}}
.live b{font-weight:800;font-size:14px}.live small{color:var(--mut);font-size:12px}
main{display:flex;flex-direction:column;padding:16px;gap:14px;min-width:0;min-height:0}
.film{flex:1;display:flex;flex-direction:column;min-height:0;background:#0b1118;border:4px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--sh)}
[data-theme=cinema] .film{background:#14040a;border-color:#e0b252;box-shadow:0 0 0 4px #7d101d,0 0 40px rgba(255,190,80,.25),8px 8px 0 var(--sh)}
.film:before,.film:after{content:"";height:11px;flex:none;margin:7px 12px;background:repeating-linear-gradient(90deg,var(--frame) 0 15px,transparent 15px 30px);border-radius:3px}
#stage{flex:1;background:#000;position:relative;overflow:hidden;margin:0 12px;border:3px solid var(--frame);border-radius:6px;min-height:0}
#player,#player iframe,#player video,#scr,#sv{width:100%;height:100%;border:0;display:block;background:#000}
#scr{position:absolute;inset:0}#sv{object-fit:contain}
#smsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#16222f,#000 70%);user-select:none}
.sm{display:flex;flex-direction:column;align-items:center;gap:10px;font-family:Outfit,Nunito,sans-serif}
.sm b{font-weight:800;font-size:clamp(18px,3.2vw,34px);color:#e4ebf2}
.sm small{font-weight:600;font-size:clamp(12px,1.6vw,16px);color:#8fa3b8}
.sm .rec{display:flex;align-items:center;gap:8px;background:#c0392b;color:#fff;font:800 12px Outfit;letter-spacing:2px;padding:4px 14px;border-radius:999px}
.sm .rec:before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.ph{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:#b4c1ce;font-size:17px;font-weight:700;line-height:1.6;background:repeating-linear-gradient(135deg,#000 0 14px,#0b0b0b 14px 28px)}
.ph div{font-size:64px}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fx span{position:absolute;bottom:-10px;font-size:36px;animation:rise 3s ease-out forwards}
@keyframes rise{to{transform:translateY(-70vh) rotate(18deg) scale(1.3);opacity:0}}
#fsin{position:absolute;top:8px;right:8px;z-index:5;background:rgba(15,20,28,.7);color:#e4ebf2;border:2px solid rgba(228,235,242,.55);border-radius:999px;padding:4px 12px;font:800 13px Nunito;cursor:pointer;opacity:.85}
#fsin:hover{opacity:1}
#unmute{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5}
body.pfs{overflow:hidden!important}
body.pfs #stage{position:fixed;inset:0;z-index:50;margin:0;border:0;border-radius:0;width:100%;height:100%}
body.pfs .film{box-shadow:none}
#stage:fullscreen{border:0;border-radius:0;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);padding:10px 14px;border:3px solid var(--ink);border-radius:20px 8px 20px 8px;box-shadow:5px 5px 0 var(--sh)}
.src{display:flex;gap:8px;flex:1;min-width:260px}.src input{flex:1}
.q{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:700}
.note{color:var(--mut);flex:1}
.react{display:flex;gap:5px;align-items:center}
.react button.e{background:var(--card);border:3px solid var(--ink);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;transition:transform .12s}
.react button.e:hover{transform:scale(1.2) rotate(-8deg);background:var(--soft)}
#emo{width:120px;text-align:center;padding:5px 8px}
.vol{display:flex;align-items:center;gap:6px;font-weight:800}
.vol input[type=range]{width:110px;padding:0;border:0;background:none;accent-color:var(--ink);cursor:pointer}
.vol input:focus{box-shadow:none}
#volIcon{cursor:pointer;font-size:20px;user-select:none}
body.viewer .hostonly,body:not(.viewer) .vonly{display:none!important}
aside{background:var(--card);display:flex;flex-direction:column;border-left:4px solid var(--ink);min-height:0}
[data-theme=cinema] aside{background:rgba(42,5,10,.92);border-left-color:#e0b252}
.tabs{display:flex;padding:10px;gap:8px;border-bottom:3px dashed var(--ink)}
.tabs button{flex:1;background:none;border:3px solid transparent;color:var(--mut);padding:5px;border-radius:12px;font:16px 'Lilita One';cursor:pointer}
.tabs button.on{border-color:var(--ink);color:var(--ink);background:var(--soft)}
.tabs i{font:800 12px Nunito;background:var(--inv);color:var(--invt);border-radius:999px;padding:0 7px;margin-left:5px}
#list,#viewers{flex:1;overflow-y:auto;padding:22px 14px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{background:var(--bg);border:3px solid var(--ink);padding:5px 12px;border-radius:16px 16px 16px 3px;max-width:90%;align-self:flex-start;word-break:break-word}
[data-theme=cinema] .msg{background:#4a0d16}
.msg.me{background:var(--inv);color:var(--invt);align-self:flex-end;border-radius:16px 16px 3px 16px}
.msg .meta{font-size:12px;opacity:.75}.msg .meta b{margin-right:6px;font-weight:400;text-decoration:underline wavy}
.msg.sys{background:none;border:0;align-self:center;color:var(--mut);font-size:13px;padding:0}
.vrow{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);padding:6px 12px;border-radius:14px 4px 14px 4px;background:var(--bg)}
.vrow span{flex:1;word-break:break-word}.vrow small{color:var(--mut);font-size:13px}.vrow small.h{color:var(--ink);font-family:'Lilita One';font-size:14px}
#form{display:flex;gap:8px;padding:12px;border-top:3px dashed var(--ink)}#form input{flex:1}
.ov{position:fixed;inset:0;background:var(--dd),var(--bg);display:grid;place-items:center;z-index:90;padding:16px;overflow:auto}
.card{background:var(--card);padding:28px;border:4px solid var(--ink);border-radius:26px 8px 26px 8px;width:100%;max-width:450px;display:flex;flex-direction:column;gap:12px;box-shadow:10px 10px 0 var(--sh)}
.card h1{font:38px Bungee,'Lilita One';text-align:center;background:linear-gradient(135deg,var(--lg1),var(--lg2));-webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(-2deg)}
.card h2{font:26px 'Lilita One'}.card p{color:var(--mut)}
.faces{display:flex;justify-content:center;gap:6px;font-size:30px}
.or{text-align:center;color:var(--mut);font-size:13px;font-weight:700}
.row{display:flex;gap:8px}.row input{flex:1}#rid{text-transform:uppercase;letter-spacing:4px}
#err{min-height:20px;font-size:14px;font-weight:700;text-decoration:underline wavy}#hint{font-size:14px;font-weight:700}
#qr{background:#f2f2f2;padding:12px;border:3px solid var(--ink);border-radius:14px;align-self:center;min-width:100px;min-height:100px;color:#141414;text-align:center}
.code{font:34px 'Lilita One';letter-spacing:8px;text-align:center}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:var(--inv);color:var(--invt);border:3px solid var(--ink);padding:6px 20px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--ink);border-radius:999px}
.logo{cursor:pointer}.logo:hover{opacity:.8}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--sh)}
#leave .btn{flex:1}
.msg{position:relative}
.msg .rq{border-left:4px solid currentColor;padding:0 8px;margin-bottom:4px;font-size:13px;opacity:.75}
.msg .acts{position:absolute;top:-15px;right:6px;display:none;gap:2px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:0 5px;z-index:2}
.msg.me .acts{right:auto;left:6px}
.msg:hover .acts,.msg:focus-within .acts,.msg.tap .acts{display:flex}
.acts button{background:none;border:0;cursor:pointer;font-size:15px;color:var(--ink);padding:1px 2px}
.rxs{display:flex;flex-wrap:wrap;gap:4px}.rxs:not(:empty){margin-top:4px}
.rx{border:2px solid var(--ink);border-radius:999px;padding:0 8px;font:800 13px Nunito;background:var(--card);color:var(--ink);cursor:pointer}
.rx.mine{background:var(--inv);color:var(--invt)}
#rbar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:3px dashed var(--ink);font-size:13px}
#rbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
#ink{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
#inkbar{position:absolute;top:8px;left:8px;z-index:6;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:75%}
#inkTools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:rgba(15,20,28,.75);border-radius:999px;padding:3px 10px}
#inkbar input[type=color]{width:34px;height:28px;padding:0;border:2px solid #e4ebf2;background:none;border-radius:8px}
#inkbar input[type=range]{width:80px;padding:0;border:0;background:none;accent-color:#e4ebf2}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){
body{overflow:auto;height:auto}#app{display:flex;flex-direction:column;height:auto;min-height:100dvh}
.top{padding:8px 12px;gap:8px}.sp{display:none}.logo{font-size:20px}main{padding:10px;flex:none}
.film{flex:none}#stage{flex:none;aspect-ratio:16/9}aside{height:70dvh;border-left:0;border-top:4px solid var(--ink)}
.q{font-size:12px}.src{min-width:100%}}
</style>
</head>

<div id="app">
<div class="top">

<main>
<div class="film"><div id="stage">

<div class="react" id="react"><button class="e">❤️</button><button class="e">😂</button><button class="e">😮</button><button class="e">👏</button><button class="e">🔥</button></div>
<div class="react"><input id="emo" placeholder="😀 any emoji" maxlength="20" aria-label="Custom emoji"><button class="btn sm" id="emoGo" type="button">Pop</button></div>
</div>
</main>
<aside>
<div class="tabs"><button class="on" data-t="list">Chat<i id="unread" class="hide">0</i></button><button data-t="viewers">Viewers<i id="vc">0</i></button></div>

</div>

const RES = {0: [3840, 2160], 720: [1280, 720], 1080: [1920, 1080], 1440: [2560, 1440], 2160: [3840, 2160]};

const maxBr = q => Math.min(50e6, BR[q.h] * FPSX[q.fps]);

    stream = await navigator.mediaDevices.getDisplayMedia({
      video: {width: {ideal: RES[q.h][0]}, height: {ideal: RES[q.h][1]}, frameRate: {ideal: q.fps}},
      audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}
    });
  } catch (e) { stream = null; return toast('Screen share cancelled'); }
  const vt = stream.getVideoTracks()[0]; vt.contentHint = q.hint; vt.onended = () => stopShare();
  if (!stream.getAudioTracks().length) toast('No audio shared. Pick a Chrome TAB and tick "Also share tab audio"');
  await ref('rtc').remove();
  ref('screen').onDisconnect().remove(); ref('rtc').onDisconnect().remove();
  await ref('screen').set({by: me, name, t: TS});
  quiet(() => player && player.pause());
  sys(name + ' started sharing their screen (' + label() + ')');
  $('shareScr').textContent = 'Stop sharing'; $('shareScr').classList.add('red');
  syncPcs(); statsLoop();
}
function stopShare(silent) {
  const was = !!stream; clearInterval(stT);
  if (stream) { stream.getTracks().forEach(t => { t.onended = null; t.stop(); }); stream = null; }
  Object.keys(pcs).forEach(id => dropPc(id));
  $('shareScr').textContent = 'Share screen'; $('shareScr').classList.remove('red');
  if (was && !silent) { ref('screen').remove(); ref('rtc').remove(); ref('want').remove(); sys(name + ' stopped sharing'); }
}
function syncPcs() {
  const ids = viewers.filter(v => v.id !== me).map(v => v.id);
  ids.forEach(id => { if (!pcs[id]) connectViewer(id); });
  Object.keys(pcs).forEach(id => { if (!ids.includes(id)) dropPc(id, true); });
}
function wantConn(id) { if (isHost && stream && id !== me && viewers.some(v => v.id === id)) connectViewer(id); }
function dropPc(id, rm) {
  const x = pcs[id];
  if (x) { x.offs.forEach(r => r.off()); try { x.pc.close(); } catch (e) {} delete pcs[id]; }
  if (rm) ref('rtc/' + id).remove();
}
function boost(sdp) {
  try {
    const mx = Math.round(maxBr(Q()) / 1000), ex = 'x-google-min-bitrate=' + Math.round(mx / 3) + ';x-google-start-bitrate=' + Math.round(mx / 2) + ';x-google-max-bitrate=' + mx;
    return sdp.split(/(?=^m=)/m).map(x => {
      if (/^m=audio/.test(x)) return x.replace(/(a=fmtp:\d+ [^\r\n]*minptime=10[^\r\n]*)/g, '$1;stereo=1;sprop-stereo=1;maxaveragebitrate=510000');
      if (/^m=video/.test(x)) return x.replace(/(a=fmtp:\d+ [^\r\n]*)/g, (m, a) => /apt=/.test(a) ? m : a + ';' + ex);
      return x;
    }).join('');
  } catch (e) { return sdp; }
}
let stT = 0, lastB = 0, lastTs = 0;
function statsLoop() {
  clearInterval(stT); lastTs = 0;
  stT = setInterval(async () => {
    const x = Object.values(pcs)[0]; if (!x || !stream || $('sv').srcObject) return;
    try {
      (await x.pc.getStats()).forEach(r => {
        if (r.type !== 'outbound-rtp' || r.kind !== 'video') return;
        const dt = (r.timestamp - lastTs) / 1000, mb = lastTs ? ((r.bytesSent - lastB) * 8 / dt / 1e6).toFixed(1) : '…';
        lastB = r.bytesSent; lastTs = r.timestamp;
        const lim = r.qualityLimitationReason && r.qualityLimitationReason !== 'none' ? ' · limited by ' + r.qualityLimitationReason : '';
        smsg('You are sharing your screen', (r.frameWidth || '?') + '×' + (r.frameHeight || '?') + ' @ ' + Math.round(r.framesPerSecond || 0) + ' FPS · ' + mb + ' Mbps' + (r.encoderImplementation ? ' · ' + r.encoderImplementation : '') + lim, true);
      });
    } catch (e) {}
  }, 2000);
}
async function connectViewer(id) {
  if (!stream) return;
  dropPc(id);
  const pc = new RTCPeerConnection(ICE), offs = []; pcs[id] = {pc, offs};
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  try {
    const rank = c => ({'video/H264': 0, 'video/VP9': 1, 'video/VP8': 2, 'video/AV1': 3}[c.mimeType] ?? 4);
    pc.getTransceivers().forEach(t => { if (t.sender.track && t.sender.track.kind === 'video' && t.setCodecPreferences) t.setCodecPreferences([...RTCRtpSender.getCapabilities('video').codecs].sort((a, b) => rank(a) - rank(b))); });
  } catch (e) {}
  let ready = false, q = [];
  const sendC = c => ref('rtc/' + id + '/h').push(c);
  pc.onicecandidate = e => { if (!e.candidate) return; const c = e.candidate.toJSON(); ready ? sendC(c) : q.push(c); };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') setTimeout(() => { if (stream && pcs[id] && pcs[id].pc === pc) connectViewer(id); }, 1500);
  };
  try {
    const o0 = await pc.createOffer(), offer = {type: o0.type, sdp: boost(o0.sdp)}; await pc.setLocalDescription(offer);
    tune(pc);
    await ref('rtc/' + id).set({offer: {type: offer.type, sdp: offer.sdp}});
    ready = true; q.forEach(sendC); q = [];
    const ar = ref('rtc/' + id + '/answer'); offs.push(ar);
    ar.on('value', async s => {
      const a = s.val(); if (!a || pc.signalingState !== 'have-local-offer') return;
      try { await pc.setRemoteDescription({type: a.type, sdp: boost(a.sdp)}); } catch (e) { return; }
      tune(pc);
      const vr = ref('rtc/' + id + '/v'); offs.push(vr);
      vr.on('child_added', c => pc.addIceCandidate(c.val()).catch(() => {}));
    });
  } catch (e) {}
}
function viewerRtc() {
  ref('rtc/' + me + '/offer').on('value', async s => {
    const o = s.val(); if (!o || isHost) return;
    if (vpc) { try { vpc.close(); } catch (e) {} vpc = null; }
    ref('rtc/' + me + '/h').off();
    const pc = vpc = new RTCPeerConnection(ICE);
    pc.ontrack = e => {
      const v = $('sv'); v.srcObject = e.streams[0]; applyVol();
      try { pc.getReceivers().forEach(r => { if ('playoutDelayHint' in r) r.playoutDelayHint = 0.5; }); } catch (x) {}
      v.play().then(() => $('unmute').classList.add('hide')).catch(() => { v.muted = true; v.play().catch(() => {}); $('unmute').classList.remove('hide'); });
      $('smsg').classList.add('hide');
    };
    pc.onicecandidate = e => { if (e.candidate) ref('rtc/' + me + '/v').push(e.candidate.toJSON()); };
    pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed' && vpc === pc) ref('want/' + me).set(TS); };
    try {
      await pc.setRemoteDescription(o);
      const a0 = await pc.createAnswer(), a = {type: a0.type, sdp: boost(a0.sdp)}; await pc.setLocalDescription(a);
      await ref('rtc/' + me + '/answer').set({type: a.type, sdp: a.sdp});
      ref('rtc/' + me + '/h').on('child_added', c => pc.addIceCandidate(c.val()).catch(() => {}));
    } catch (e) {}
  });
}

// ---------- Chat: reply + reactions ----------
let replyTo = null, leftRef = null, leaving = false, inkData = {}, cur = null, drawing = false;
function setReply(m) { replyTo = {s: m.sender, t: String(m.text).slice(0, 80)}; $('rtxt').textContent = 'Replying to ' + replyTo.s + ': ' + replyTo.t; $('rbar').classList.remove('hide'); $('msg').focus(); }
function clearReply() { replyTo = null; $('rbar').classList.add('hide'); }
$('rcl').onclick = clearReply;
function renderRx(d, rx) {
  const box = d.querySelector('.rxs'); if (!box) return; box.innerHTML = '';
  const c = {}; Object.entries(rx || {}).forEach(([u, e]) => (c[e] = c[e] || []).push(u));
  Object.entries(c).forEach(([e, us]) => {
    const b = document.createElement('button'); b.className = 'rx' + (us.includes(me) ? ' mine' : ''); b.textContent = e + ' ' + us.length;
    b.onclick = ev => { ev.stopPropagation(); toggleRx(d.dataset.k, e); }; box.appendChild(b);
  });
}
function toggleRx(k, e) { const r = ref('messages/' + k + '/rx/' + me); r.once('value').then(s => s.val() === e ? r.remove() : r.set(e)); }

// ---------- Annotations (draw on the screen, any color) ----------
const cv = $('ink'), cx = cv.getContext('2d');
function fitInk() { const r = $('stage').getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = Math.max(1, r.width * d); cv.height = Math.max(1, r.height * d); redraw(); }
if (window.ResizeObserver) new ResizeObserver(fitInk).observe($('stage')); else addEventListener('resize', fitInk);
function stroke(s) {
  const p = s.p; if (!p || p.length < 2) return;
  cx.strokeStyle = cx.fillStyle = s.c; cx.lineWidth = Math.max(1.5, s.w * cv.width / 1000); cx.lineCap = cx.lineJoin = 'round';
  if (p.length < 4) { cx.beginPath(); cx.arc(p[0] * cv.width, p[1] * cv.height, cx.lineWidth / 2, 0, 7); cx.fill(); return; }
  cx.beginPath(); cx.moveTo(p[0] * cv.width, p[1] * cv.height);
  for (let i = 2; i < p.length; i += 2) cx.lineTo(p[i] * cv.width, p[i + 1] * cv.height);
  cx.stroke();
}
function redraw() { cx.clearRect(0, 0, cv.width, cv.height); Object.values(inkData).forEach(u => Object.values(u || {}).forEach(stroke)); if (cur) stroke(cur); }
const pt = e => { const r = cv.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
cv.onpointerdown = e => { if (!cv.classList.contains('on')) return; cv.setPointerCapture(e.pointerId); drawing = true; cur = {c: $('inkc').value, w: +$('inkw').value, p: pt(e)}; redraw(); };
cv.onpointermove = e => {
  if (!drawing) return; const q = pt(e), p = cur.p, n = p.length;
  if (n > 1600 || Math.hypot(q[0] - p[n - 2], q[1] - p[n - 1]) < .002) return;
  p.push(q[0], q[1]); redraw();
};
cv.onpointerup = cv.onpointercancel = () => {
  if (!drawing) return; drawing = false; const st = cur; cur = null;
  st.p = st.p.map(v => Math.round(v * 5000) / 5000); ref('ink/' + me).push(st);
};
$('inkOn').onclick = () => { const on = cv.classList.toggle('on'); $('inkTools').classList.toggle('hide', !on); $('inkOn').textContent = on ? '✏️ Done' : '✏️ Draw'; };
$('inkUndo').onclick = () => { const k = Object.keys(inkData[me] || {}).sort().pop(); if (k) ref('ink/' + me + '/' + k).remove(); };
$('inkMine').onclick = () => ref('ink/' + me).remove();
$('inkAll').onclick = () => { if (isHost && confirm("Clear everyone's drawings?")) ref('ink').remove(); };

// ---------- Leave room (logo) with confirmation ----------
function askLeave() {
  if (!room) return;
  $('lvt').textContent = isHost ? 'End your host session?' : 'Leave the room?';
  $('lvp').textContent = isHost
    ? 'You are the host. Leaving stops any screen share. Viewers stay in the room and can take over as host. Are you sure?'
    : 'You will go back to the home screen. You can rejoin with the room code ' + room + '.';
  const go = $('lvGo'); go.disabled = true; setTimeout(() => go.disabled = false, isHost ? 1200 : 500);
  $('leave').classList.remove('hide'); $('lvStay').focus();
}
$('logo').onclick = askLeave;
$('logo').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); askLeave(); } };
$('lvStay').onclick = () => $('leave').classList.add('hide');
$('leave').onclick = e => { if (e.target === $('leave')) $('leave').classList.add('hide'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('leave').classList.add('hide'); });
$('lvGo').onclick = async () => {
  $('lvGo').disabled = true; leaving = true;
  try { if (isHost && stream) stopShare(); if (leftRef) leftRef.onDisconnect().cancel(); await ref('presence/' + me).remove(); await sys(name + ' left'); } catch (e) {}
  location.href = location.pathname;
};
addEventListener('beforeunload', e => { if (isHost && stream && !leaving) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
